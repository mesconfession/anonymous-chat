<!DOCTYPE html>
<html>
<head>
    <title>Anonymous Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 90%;
            max-width: 420px;
            background: #15151c;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
        }

        select,
        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
        }

        select {
            background: #252530;
            color: white;
        }

        button {
            background: #ffffff;
            color: #000;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.98);
        }

        .privacy {
            font-size: 12px;
            margin-top: 20px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Anonymous Chat</h1>

    <p>Talk to a random person without sharing your identity</p>

    <form action="/start" method="POST">

        <select name="gender" required>
            <option value="">Select your gender</option>
            <option value="boy">Boy</option>
            <option value="girl">Girl</option>
        </select>

        <button type="submit">
            Start Chat
        </button>

    </form>

    <div class="privacy">
        No name • No phone number • No profile
    </div>

</div>

</body>
</html>
